services:
  opencart:
    build: tools
    ports:
      - "8888:80"
    volumes:
      - ./upload:/var/www/html
      - ./storage:/storage
      - ./scripts/write-config.php:/usr/local/bin/write-config.php:ro
      - ./scripts/local-entrypoint.sh:/usr/local/bin/local-entrypoint.sh:ro
    environment:
      DIR_OPENCART: /var/www/html/
      DIR_STORAGE: /storage/
      DB_HOSTNAME: mysql
      DB_USERNAME: root
      DB_PASSWORD: opencart
      DB_DATABASE: opencart
      DB_PORT: "3306"
      DB_PREFIX: ws_
      OPENCART_HTTP_SCHEME: http
      OPENCART_HTTP_HOST: localhost:8888
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/usr/local/bin/local-entrypoint.sh"]

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: opencart
      MYSQL_DATABASE: opencart
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-popencart"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    ports:
      - "8889:8080"

volumes:
  mysql_data:
